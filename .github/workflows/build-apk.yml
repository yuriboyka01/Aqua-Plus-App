name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom Release Tag (leave empty to use package.json version, e.g. v0.0.7)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish a GitHub Release with the APK'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Run Invariant Regressions Suite
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Configure Release Signing Keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android/app/aquaplus-release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=aquaplus-release.keystore\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "signed_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are not configured. Falling back to debug APK; updates over previous installs will fail due to ephemeral debug keys."
            echo "signed_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed_release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Cleanup Release Signing Files
        if: always()
        run: rm -f android/app/aquaplus-release.keystore android/key.properties

      - name: Stage APK Artifact with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            CLEAN_VER="${INPUT_TAG#v}"
            TAG_NAME="v$CLEAN_VER"
            APP_VERSION="$CLEAN_VER"
          else
            TAG_NAME="v$VERSION"
            APP_VERSION="$VERSION"
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          if [ "${{ steps.signing.outputs.signed_release }}" = "true" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$APK_SRC" "AquaPlus-Service-${TAG_NAME}.apk"
          echo "Generated APK: AquaPlus-Service-${TAG_NAME}.apk (from $APK_SRC)"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaPlus-Service-${{ env.RELEASE_TAG }}
          path: AquaPlus-Service-*.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AquaPlus Service ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: AquaPlus-Service-*.apk
          body: |
            ### AquaPlus Service Android App Release (${{ env.RELEASE_TAG }})
            
            This APK was built automatically from the web application stack via GitHub Actions.
            
            #### Direct Download & Installation:
            1. Download the attached **`AquaPlus-Service-${{ env.RELEASE_TAG }}.apk`** directly on your Android phone.
            2. Tap the file to install (allow "Install unknown apps" in Settings if prompted).
            3. Open **AquaPlus Service** and sign in with your authorized owner account.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
