name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom Release Tag (leave empty to use package.json version, e.g. v0.0.7)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish a GitHub Release with the APK'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Run Invariant Regressions Suite
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Assemble Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK Artifact with Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            CLEAN_VER="${INPUT_TAG#v}"
            TAG_NAME="v$CLEAN_VER"
            APP_VERSION="$CLEAN_VER"
          else
            TAG_NAME="v$VERSION"
            APP_VERSION="$VERSION"
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk "AquaPlus-Service-${TAG_NAME}.apk"
          echo "Generated APK: AquaPlus-Service-${TAG_NAME}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaPlus-Service-${{ env.RELEASE_TAG }}
          path: AquaPlus-Service-*.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AquaPlus Service ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: AquaPlus-Service-*.apk
          body: |
            ### AquaPlus Service Android App Release (${{ env.RELEASE_TAG }})
            
            This APK was built automatically from the web application stack via GitHub Actions.
            
            #### Direct Download & Installation:
            1. Download the attached **`AquaPlus-Service-${{ env.RELEASE_TAG }}.apk`** directly on your Android phone.
            2. Tap the file to install (allow "Install unknown apps" in Settings if prompted).
            3. Open **AquaPlus Service** and sign in with your authorized owner account.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
